name: Phase 7 model call consumed

on:
  pull_request:
    branches: [main]
    paths:
      - config/phase7-acceptance-run-v0.1.json
      - tools/phase7_functional_acceptance.py
      - tests/test_phase7_functional_acceptance.py
      - .github/workflows/phase7-functional-acceptance.yml
  push:
    branches: [main]
    paths:
      - config/phase7-acceptance-run-v0.1.json
      - tools/phase7_functional_acceptance.py
      - tests/test_phase7_functional_acceptance.py
      - .github/workflows/phase7-functional-acceptance.yml

permissions:
  contents: read

jobs:
  consumed-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run deterministic Saddle regression
        run: python -m unittest discover -s tests -v

      - name: Verify paid Phase 7 path is permanently consumed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/phase7-acceptance-run-v0.1.json').read_text(encoding='utf-8'))
          workflow = Path('.github/workflows/phase7-functional-acceptance.yml').read_text(encoding='utf-8')
          secret_name = 'GEMINI' + '_API_KEY'
          paid_job_name = 'phase7' + '-e2e'
          assert cfg['status'] == 'MODEL_CALL_CONSUMED_RECOVERY_ONLY'
          assert cfg['limits']['max_model_calls'] == 1
          assert cfg['limits']['automatic_retries'] == 0
          assert secret_name not in workflow
          assert paid_job_name not in workflow
          print('Phase 7 paid model path consumed: PASS')
          PY
